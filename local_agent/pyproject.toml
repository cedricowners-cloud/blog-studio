[tool.poetry]
name = "local-agent"
version = "0.1.0"
description = "blog_studio local agent — Chrome 자동화 담당"
authors = ["blog_studio"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
python-dotenv = "^1.0.0"
supabase = "^2.9.0"
seleniumbase = "^4.32.0"
selenium = "^4.25.0"
pyperclip = "^1.9.0"
requests = "^2.32.0"
pystray = "^0.19.5"
pillow = "^11.0.0"
cryptography = "^43.0.0"
qrcode = {extras = ["pil"], version = "^7.4.2"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
