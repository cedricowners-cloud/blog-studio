[tool.poetry]
name = "content-service"
version = "0.1.0"
description = "blog_studio content service — Chrome-free Python logic over FastAPI"
authors = ["blog_studio"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"
supabase = "^2.9.0"
# LLM
google-generativeai = "^0.8.0"
openai = "^1.50.0"
anthropic = "^0.40.0"
# Content helpers
beautifulsoup4 = "^4.12.0"
requests = "^2.32.0"
pillow = "^11.0.0"
jinja2 = "^3.1.0"
playwright = "^1.48.0"
youtube-transcript-api = "^0.6.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
