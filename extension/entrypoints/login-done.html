<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blog_studio 도우미 · 로그인됨</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        background: #f6f7f9;
        color: #1c2430;
      }
      main {
        max-width: 420px;
        padding: 28px 32px;
        background: #fff;
        border: 1px solid #e3e6eb;
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 6px 0;
        color: #475467;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #14181f;
          color: #e6e9ee;
        }
        main {
          background: #1c222b;
          border-color: #2c3440;
        }
        p {
          color: #98a2b3;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>확장에 로그인됐어요</h1>
      <p>blog_studio 도우미가 메일의 링크로 로그인했어요.</p>
      <p>이 탭은 닫아도 돼요. 크롬 옆의 도우미 창으로 돌아가 주세요.</p>
    </main>
  </body>
</html>
